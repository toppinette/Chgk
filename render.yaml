services:
  - type: worker
    name: chgk-copilot-bot
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: python -m bot.main
    autoDeploy: true
    disk:
      name: chgk-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: RATING_API_BASE
        value: https://api.rating.chgk.info
      - key: RATING_API_TIMEOUT
        value: "15"
      - key: BOT_DB_PATH
        value: /var/data/bot.db
