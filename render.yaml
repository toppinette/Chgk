services:
  - type: worker
    name: chgk-copilot-bot
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: python -m bot.main
    autoDeploy: true
    envVars:
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: RATING_API_BASE
        value: https://api.rating.chgk.info
      - key: RATING_API_TIMEOUT
        value: "15"
      - key: BOT_DB_PATH
        value: /opt/render/project/src/bot.db
